}
async function renderFamilies(){sec().innerHTML=base()+`<div class="card"><div class="bar">${button('v-back','חזרה לסרטונים')}</div><h2>בקשות הצטרפות</h2><p class="mut">הורים פותחים את קישור ההרשמה, מתחברים עם Google ושולחים בקשה. אין אישור אוטומטי.</p><input id="v-signuplink" readonly dir="ltr" value="${h(location.origin+location.pathname+'?signup=1#videos')}"><div id="v-requests"></div><h2>משפחות מאושרות</h2><p class="mut">כתובות נשמרות רק בשירות הפרטי, לא באתר הציבורי. הוספה מאפשרת כניסה; היא אינה שולחת הזמנה.</p><label for="v-email">חשבון Google של ההורה</label><input id="v-email" type="email" dir="ltr" placeholder="parent@example.com"><div class="bar">${button('v-addfamily','הוספת משפחה','pri')}</div><div id="v-familylist"></div><h2>בקשות הסרה</h2><div id="v-reports"></div></div>`;bindLogout();E('#v-back').onclick=()=>{view='gallery';render();};E('#v-addfamily').onclick=async()=>{try{await api('/admin/members','POST',{email:E('#v-email').value});renderFamilies();}catch(e){notice(errorText(e));}};try{const [d,r,q]=await Promise.all([api('/admin/members'),api('/admin/reports'),api('/admin/requests')]);if(view!=='families')return;E('#v-requests').innerHTML=q.requests.length?q.requests.map(q=>`<div class="card"><b dir="ltr">${h(q.email)}</b><div class="bar"><button class="btn pri" data-requestemail="${h(q.email)}" data-action="approve">אישור גישה</button><button class="btn red" data-requestemail="${h(q.email)}" data-action="reject">דחייה</button></div></div>`).join(''):'<p class="mut">אין בקשות ממתינות.</p>';sec().querySelectorAll('[data-requestemail]').forEach(b=>b.onclick=async()=>{try{await api('/admin/requests','POST',{email:b.dataset.requestemail,action:b.dataset.action});renderFamilies();}catch(e){notice(errorText(e));}});E('#v-familylist').innerHTML=d.members.map(m=>`<div class="card"><b dir="ltr">${h(m.email)}</b><div class="mut">${m.role==='admin'?'מנהל':m.enabled?'משפחה מאושרת':'גישה בוטלה'}</div>${m.role!=='admin'&&m.enabled?`<button class="btn sm red" data-revoke="${h(m.email)}">ביטול גישה</button>`:''}</div>`).join('');sec().querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('לבטל גישה לחשבון '+b.dataset.revoke+'?'))return;try{await api('/admin/members','POST',{email:b.dataset.revoke,enabled:false});renderFamilies();}catch(e){notice(errorText(e));}});E('#v-reports').innerHTML=r.reports.length?r.reports.map(r=>`<div class="card"><div>${h(r.reason)}</div><div class="mut">${h(r.created_at)}</div><button class="btn sm" data-reportvideo="${h(r.video_id)}">פתיחת הקליפ</button></div>`).join(''):'<div class="mut">אין בקשות הסרה.</div>';sec().querySelectorAll('[data-reportvideo]').forEach(b=>b.onclick=()=>{view='gallery';render();play(b.dataset.reportvideo);});}catch(e){notice(errorText(e));}}
window.TeamVideos={open(gameId){filter.game=gameId||'';view='gallery';tab('videos');render();},render};
document.addEventListener('visibilitychange',()=>{if(document.hidden)E('#v-player')?.pause();});
render();
})();
</script>

<script>
/* ===================================================================
   כרטיס "המשחק הבא" + התראות Push (PWA)
   הנתונים מגיעים מ-data/next-game.json שמתעדכן אוטומטית מדי בוקר.
   =================================================================== */
(function(){
const NG = document.getElementById('ngc');
const PUSH_API = 'https://maccabi-rehovot-api.pages.dev';
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function b64ToU8(b64){const p='='.repeat((4-b64.length%4)%4);const b=atob((b64+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)));}
const isIOS = ()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = ()=>window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function toast2(m){const t=document.getElementById('toast');if(t){t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}}

function fmtDate(d,time,arrive){
  try{
    const dt=new Date(d+'T'+(time||'00:00')+':00');
    const wd=new Intl.DateTimeFormat('he-IL',{weekday:'long'}).format(dt);
    const dd=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'numeric'}).format(dt);
    let s=wd+', '+dd+(time?' · '+time:' · שעה תפורסם');
    if(arrive)s+=' (הגעה '+arrive+')';
    return s;
  }catch{return d+' '+(time||'');}
}
function ics(g){
  const day=calendarDay(g.date),title='הפועל מרמורק רחובות '+(g.home?'-':'מול ')+(g.opponent||'');
  const loc=[g.venue,g.address].filter(Boolean).join(', ');
  const start=g.time?`DTSTART;TZID=Asia/Jerusalem:${day}T${g.time.replace(':','')}00`:`DTSTART;VALUE=DATE:${day}`;
  const end=g.time?'DURATION:PT2H':`DTEND;VALUE=DATE:${calendarShiftDay(g.date,1)}`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ironi-rehovot//he','BEGIN:VEVENT',
    'UID:game-'+(g.round||'x')+'-'+Date.now()+'@ironi-rehovot','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    start,end,'SUMMARY:'+title,'LOCATION:'+loc,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function gcalUrl(g){
  const day=calendarDay(g.date),end=calendarEnd(g.date,g.time||'09:00');
  const dates=g.time?`${day}T${g.time.replace(':','')}00/${end.day}T${end.time}00`:`${day}/${calendarShiftDay(g.date,1)}`;
  const p=new URLSearchParams({action:'TEMPLATE',text:'הפועל מרמורק רחובות '+(g.home?'-':'מול ')+(g.opponent||''),dates,location:[g.venue,g.address].filter(Boolean).join(', '),ctz:'Asia/Jerusalem'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

async function pushStatus(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!window.isSecureContext)return 'unsupported';
  try{const reg=await navigator.serviceWorker.getRegistration();if(!reg)return 'off';const s=await reg.pushManager.getSubscription();if(Notification.permission!=='granted')return 'off';return s?(localStorage.getItem('mr_push_registered_endpoint')===s.endpoint?'on':'unverified'):'off';}catch{return 'off';}
}
async function renderBell(btn){
  const st=await pushStatus();
  if(st==='on'){btn.classList.add('on');btn.innerHTML='🔔 עדכונים נרשמו במכשיר';}
  else if(st==='unverified'){btn.classList.remove('on');btn.innerHTML='🔔 השלמת רישום לעדכונים';}
  else{btn.classList.remove('on');btn.innerHTML='🔕 עדכונים כלליים';}
}
async function togglePush(btn){
  const permissionRequest=(!isIOS()||isStandalone())&&("Notification" in window)&&("PushManager" in window)&&("serviceWorker" in navigator)&&Notification.permission==="default"?Notification.requestPermission().catch(()=>"denied"):null;
  const st=await pushStatus();
  if(st==='unsupported'){
    if(isIOS()&&!isStandalone()){toast2('באייפון: קודם הוסיפו למסך הבית (שתף → הוספה למסך הבית), ואז הפעילו עדכונים מהאפליקציה');}
    else toast2('הדפדפן לא תומך בהתראות');
    return;
  }
  if(isIOS()&&!isStandalone()){toast2('באייפון: מתקינים קודם את האתר למסך הבית (שתף → הוספה למסך הבית) ופותחים ממנו');return;}
  let pushStep='הכנת שירות ההתראות';
  try{
    await navigator.serviceWorker.register('sw.js');
    const reg=await navigator.serviceWorker.ready;
    if(st==='on'){
      const s=await reg.pushManager.getSubscription();
      if(s){await fetch(PUSH_API+'/push/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe();localStorage.removeItem('mr_push_registered_endpoint');}
      toast2('העדכונים הכלליים כובו');
    }else{
      const perm=permissionRequest?await permissionRequest:Notification.permission;
      if(perm!=='granted'){toast2(perm==='denied'?'הרשאת התראות חסומה. באייפון: הגדרות ← עדכונים ← אפליקציית הקבוצה, ואישור התראות.':'לא אושרה בקשת ההתראות. פתחו ממסך הבית ונסו שוב.');return;}
      pushStep='קבלת מפתח ההתראות';
      const kr=await fetch(PUSH_API+'/push/key');if(!kr.ok)throw Error('key');const k=await kr.json();
      pushStep='רישום בשירות ההתראות של המכשיר';
      const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(k.key)});
      const j=sub.toJSON();
      pushStep='שמירת הרישום בשרת';
      const r=await fetch(PUSH_API+'/push/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint,keys:j.keys,ua:navigator.userAgent.slice(0,180)})});
      if(!r.ok)throw 0;
      localStorage.setItem('mr_push_registered_endpoint',sub.endpoint);
      toast2('העדכונים הכלליים הופעלו! נעדכן על שינויים בלוח המשחקים, תוצאות ועדכוני תוצאה');
    }
  }catch(e){toast2('ההרשמה נכשלה בשלב: '+pushStep+(e?.name?' ('+e.name+')':'')+'. צלמו את ההודעה אם התקלה חוזרת.');}
  renderBell(btn);
}

let installEvt=null;
function syncInstallButton(){
  const b=document.getElementById('installApp');
  if(!b)return;
  const installed=isStandalone();
  b.hidden=installed;
  b.disabled=installed;
  b.setAttribute('aria-hidden',String(installed));
}
function installInstructions(){
  if(isIOS())return 'באייפון או באייפד: פתחו את האתר ב-Safari, הקישו על שיתוף, גללו ובחרו "הוספה למסך הבית", ואז הקישו "הוספה".';
  if(/android/i.test(navigator.userAgent))return 'ב-Chrome: הקישו על ⋮ ובחרו "התקנת אפליקציה" או "הוספה למסך הבית".';
  return 'פתחו את תפריט הדפדפן וחפשו "התקנת אפליקציה" או "הוספה למסך הבית". אם מופיע סמל התקנה בשורת הכתובת, אפשר לבחור גם בו.';
}
async function installApp(){
  if(isStandalone()){syncInstallButton();return;}
  if(installEvt){
    const promptEvent=installEvt;installEvt=null;
    try{promptEvent.prompt();const choice=await promptEvent.userChoice;if(choice?.outcome==='accepted'){syncInstallButton();return;}}catch{}
  }
  const p=document.getElementById('installSteps');if(p)p.textContent=installInstructions();
  const dlg=document.getElementById('installHelp');
  if(dlg?.showModal)dlg.showModal();else alert(installInstructions());
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;syncInstallButton();});
window.addEventListener('appinstalled',()=>{installEvt=null;syncInstallButton();});
const installMode=window.matchMedia('(display-mode: standalone)');
if(installMode.addEventListener)installMode.addEventListener('change',syncInstallButton);
const installButton=document.getElementById('installApp');
installButton?.addEventListener('click',installApp);
document.getElementById('closeInstallHelp')?.addEventListener('click',()=>document.getElementById('installHelp')?.close());
syncInstallButton();

async function load(){
  let g=null;
  try{const r=await fetch('data/next-game.json?cb='+Date.now());if(r.ok)g=await r.json();}catch{}
  if(!g||!g.opponent){NG.hidden=true;topLiveUid=null;renderGames();return;}
  const match=(g.uid&&S.games.find(x=>x.uid===g.uid))||S.games.find(x=>x.type===g.type&&Number(x.round)===Number(g.round)&&x.opponent===g.opponent);
  const live=match?.live?match:null,final=match&&!match.live&&played(match)?match:null;
  topLiveUid=live?.uid||null;
  if(match)g={...g,id:match.id,uid:match.uid,live:live?.live,score:match.score,events:match.events,home:match.home,venue:match.venue||g.venue,final:!!final};
  if(g.type==='league'&&Number(g.round)===1&&g.opponent==='הפועל רעננה')g.address=VENUE_OVERRIDES['ifa-2026-27-round-1'].nextGameAddress;
  const isLive=!!g.live,isFinal=!isLive&&!!g.final,score=g.score||[0,0];
  const waze='https://waze.com/ul?q='+encodeURIComponent(g.address||g.venue||'')+'&navigate=yes';
  const placeParts=[g.venue,g.address].filter(Boolean),placeKey=x=>String(x).normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").split(/\s+/).filter(w=>w&&w!=="רחוב"&&w!=="street").sort().join(" "),placeText=placeParts.filter((x,i)=>!i||placeKey(x)!==placeKey(placeParts[0])).join(" · ");
  const evs=(g.events||[]).filter(e=>e.kind!=="assist").sort((a,b)=>(a.min||0)-(b.min||0));
  const liveEvents=evs.length?`<div class="ng-live-events"><b>אירועים</b>${evs.map(e=>`<div>${KINDS[e.kind]?.split(" ")[0]||"•"} ${e.min!=null&&e.min!==""?e.min+"' ":""}${esc(e.player||"")} ${esc(e.text||"")}</div>`).join("")}</div>`:"";
  const phase=g.live?.phase==="half"?"מחצית":g.live?.phase==="second"?"מחצית שנייה":g.live?.phase?.startsWith("first")?"מחצית ראשונה":"";
  const scoreLabel=`הפועל מרמורק רחובות: ${score[0]}, ${g.opponent}: ${score[1]}`;
  NG.innerHTML=`<div class="ng ${isLive?"ng-live":isFinal?"ng-final":""}">
    <div class="ng-head"><span class="ng-title">${isLive?"🔴 משחק חי":isFinal?"🏁 תוצאה סופית":g.result?"⚽ המשחק האחרון":"⚽ המשחק הבא"}</span>${g.type==='cup'?`<span class="ng-round">גביע · ${esc(g.roundLabel||'משחק גביע')}</span>`:g.round?`<span class="ng-round">מחזור ${esc(g.round)}</span>`:""}</div>
    ${isLive||isFinal?`<div class="ng-live-score" aria-label="${esc(scoreLabel)}"><div class="ng-score-row"><div class="ng-score-team"><b dir="ltr">${score[0]}</b><span>הפועל מרמורק רחובות</span></div><strong aria-hidden="true">:</strong><div class="ng-score-team"><b dir="ltr">${score[1]}</b><span>${esc(g.opponent)}</span></div></div><div class="ng-live-meta">${isLive?'<span class="livedot">🔴 חי</span>':'🏁 הסתיים'}${isLive&&phase?" · "+phase:""}${isLive&&g.live.min!=null&&g.live.min!==""?" · דקה "+esc(g.live.min):""}</div></div>`:""}
    <div class="ng-teams">${isLive||isFinal?`הפועל מרמורק רחובות - ${esc(g.opponent)}`:`${g.home?"הפועל מרמורק רחובות":"מול"} ${esc(g.opponent)} <span class="ng-ha">${g.home?"🏠 בית":"🚌 חוץ"}</span>`}</div>
    ${isFinal?`<div class="ng-result">תוצאה סופית: ${score[0]} : ${score[1]}</div>`:g.result?`<div class="ng-result">תוצאה: ${esc(g.result)}</div>`:""}
    ${liveCardAdminControls(g)}
    ${liveEvents}
    <div class="ng-row">📅 <b>${esc(fmtDate(g.date,g.time,g.arrive))}</b></div>
    ${placeText?`<div class="ng-row">📍 ${esc(placeText)}</div>`:`<div class="ng-row">📍 מגרש טרם פורסם</div>`}
    ${g.note?`<div class="ng-row">${esc(g.note)}</div>`:""}
    ${placeParts.length?`<div class="ng-btns"><a class="waze" href="${waze}" target="_blank" rel="noopener">🚗 Waze</a></div>`:""}
    <div class="ng-btns"><button class="bell" id="ngBell">🔕 עדכונים כלליים</button></div>
    <div class="ng-note">${isLive?"המשחק מתעדכן בזמן אמת על ידי מנהל הקבוצה.":isFinal?"התוצאה הסופית נשמרה.":"המידע מתעדכן אוטומטית מדי בוקר. בלחיצה על הכפתור - עדכונים על שינויים בלוח המשחקים, תוצאות ועדכוני תוצאה. חדשות לא נכללות כרגע."}</div>
  </div>`;
  NG.hidden=false;
  const bell=document.getElementById('ngBell');bell.onclick=()=>togglePush(bell);renderBell(bell);renderGames();
}

window.refreshTeamNextGame=load;
load();
})();
</script>
