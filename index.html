<!DOCTYPE html>
<html lang="he" dir="rtl">

<meta charset="utf-8">

<title>מכבי רחובות</title>
<style>
:root{--c:#0b5ed7;--bg:#f4f6fa;--tx:#1b2430;--mut:#6b7686;--bd:#e1e6ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
header{background:var(--c);color:#fff;padding:14px;text-align:center}
header h1{margin:0;font-size:1.35rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
nav{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bd);overflow-x:auto;z-index:5}
nav button{flex:1;min-width:max-content;border:0;background:none;padding:12px 12px;font:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--c);border-color:var(--c)}
main{max-width:720px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
.chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chips button,.btn{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;color:var(--tx)}
.chips button.on,.btn.pri{background:var(--c);color:#fff;border-color:var(--c)}
.btn.red{color:#d23;border-color:#d23}.btn.wa{background:#25d366;color:#fff;border-color:#25d366}
.btn.sm{padding:4px 12px;font-size:.85rem}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.game{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;margin-inline-end:6px}
.t-league{background:#0b5ed7}.t-cup{background:#c98a00}.t-friendly{background:#2e9e5b}
.score{font-size:1.3rem;font-weight:700;white-space:nowrap;text-align:center}
.mut{color:var(--mut);font-size:.85rem}
.W{color:#2e9e5b}.L{color:#d23}.D{color:#888}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}td:first-child,th:first-child{text-align:right}
h2{font-size:1.05rem;margin:14px 0 8px}
.empty{text-align:center;color:var(--mut);padding:18px}
.note{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px;font-size:.85rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.num{display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:var(--c);color:#fff;font-weight:700;margin-inline-end:8px}
.badge{display:inline-block;font-size:.75rem;background:#eef3ff;border-radius:99px;padding:1px 8px;margin:2px 0 0 4px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.ev{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:.9rem}
pre{white-space:pre-wrap;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;font:inherit;direction:rtl}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:20}
a{color:var(--c)}

[data-match]{cursor:pointer}[data-match]:focus-visible{outline:3px solid #8cbbff;outline-offset:2px}#match-share{width:min(700px,calc(100vw - 28px));max-height:85vh;overflow:auto;border:1px solid #dbe3ef;border-radius:16px;padding:20px;color:#172337}#match-share::backdrop{background:#17233799}#match-share textarea{width:100%;font:inherit;line-height:1.6}#s-admin{scroll-margin-top:70px}
</style>
<style>
.v-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 16px}.v-heading h2{margin:0;font-size:1.3rem}.v-empty{text-align:center;padding:24px 16px}.v-mark{display:grid;place-items:center;margin:0 auto 14px;background:#e9f1ff;color:var(--c);border-radius:50%;width:64px;height:64px;font-size:26px}.v-empty p{max-width:460px;margin:12px auto}.v-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v-card{padding:0;overflow:hidden}.v-card h3{font-size:1rem;margin:10px 12px 4px;overflow-wrap:anywhere}.v-card .mut,.v-card .badge,.v-card .bar{margin:8px 12px}.v-preview{border:0;width:100%;height:145px;background:linear-gradient(135deg,#143c72,#0b5ed7);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:inherit;cursor:pointer}.v-preview:disabled{opacity:.55;cursor:default}.v-playicon{display:grid;place-items:center;width:46px;height:46px;border:1px solid #ffffff80;border-radius:50%;padding-left:3px}.v-check{display:flex;align-items:flex-start;gap:10px;color:var(--tx);line-height:1.6}.v-check input{width:20px;height:20px;flex:none;margin-top:3px}.v-tags{margin-top:16px}.v-fieldset{border:1px solid var(--bd);border-radius:10px;margin:16px 0;padding:8px 12px}.v-fieldset legend{font-size:.9rem;color:var(--mut)}#v-player{display:block;width:100%;max-height:65vh;background:#111;border-radius:8px}#v-google{display:flex;justify-content:center;margin:20px 0}#v-progress{width:100%;height:18px;margin:12px 0}#s-videos button:focus-visible{outline:3px solid #8cbbff;outline-offset:2px}#s-videos .note{overflow-wrap:anywhere}#v-uploadstatus{overflow-wrap:anywhere}#v-playarea{scroll-margin-top:65px}@media(max-width:400px){.v-grid{gap:8px}.v-preview{height:120px}.v-heading h2{font-size:1.15rem}.v-heading .mut{font-size:.78rem}.v-card h3{font-size:.92rem}.v-tags button{padding:7px 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

#v-photo{display:block;width:100%;max-height:70vh;object-fit:contain;background:#111;border-radius:8px}#v-requests b,#v-familylist b{overflow-wrap:anywhere}#v-signuplink{font-size:.8rem}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* state = נתוני האתר, או שינויים מקומיים שטרם פורסמו מהמכשיר הזה */

try{const l=JSON.parse(localStorage.getItem(LS)||"null");if(l&&l.base===DATA.rev){S=l.data;dirty=true}}catch(e){}
function persist(){dirty=true;localStorage.setItem(LS,JSON.stringify({base:DATA.rev,data:S}));renderAll()}

const played=g=>Array.isArray(g.score);
const fd=d=>new Date(d+"T00:00").toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"});
const fdl=d=>new Date(d+"T00:00").toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
const res=g=>{if(!played(g))return"";const[a,b]=g.score;return a>b?"W":a<b?"L":"D"};
const gname=g=>`${g.home?"בית":"חוץ"} נגד ${g.opponent}`;
let filter="all",statFilter="all";

function gameCard(g){
  const r=res(g),rl={W:"ניצחון",L:"הפסד",D:"תיקו"}[r]||"";
  const sc=played(g)?`<div class="score ${r}">${g.score[0]} : ${g.score[1]}<div class="mut" style="font-size:.75rem">${rl}</div></div>`:`<div class="mut">${esc(g.time||"שעה תפורסם")}</div>`;
  const evs=(g.events||[]).filter(e=>e.kind!=="assist").sort((a,b)=>(a.min||0)-(b.min||0));
  const ex=evs.length?`<div class="mut" style="margin-top:6px">`+evs.map(e=>`${KINDS[e.kind].split(" ")[0]} ${e.min?e.min+"' ":""}${esc(e.player||"")} ${esc(e.text||"")}`).join("<br>")+`</div>`:"";
  const mv=S.badges.filter(b=>b.gameId===g.id).map(b=>`<div class="mut">${esc(b.text)}: ${esc(b.player)}</div>`).join("");
  return `<div class="card" data-match="${g.id}" role="button" tabindex="0" aria-label="פתיחת משחק: ${esc(g.opponent)}" onclick="if(!event.target.closest('button,a'))openMatch(${g.id})" onkeydown="if(event.key==='Enter'&&event.target===this)openMatch(${g.id})"><div class="game"><div><span class="tag t-${g.type}">${TYPES[g.type]}</span><b>מכבי רחובות - ${esc(g.opponent)}</b><div class="mut">${fd(g.date)} · ${g.home?"בית":"חוץ"}${g.venue?" · "+esc(g.venue):""}${g.note?" · "+esc(g.note):""}</div></div>${sc}</div>${ex}${mv}<div class="bar"><button class="btn sm" onclick="TeamVideos.open('${esc(g.uid||("legacy-"+g.id))}')">▶ סרטוני המשחק</button></div></div>`;
}
const chips=(cur,fn)=>`<div class="chips">`+[["all","הכול"],["league","ליגה"],["cup","גביע"],["friendly","אימון"]].map(([k,l])=>`<button class="${cur===k?"on":""}" onclick="${fn}('${k}')">${l}</button>`).join("")+`</div>`;
function setF(k){filter=k;renderGames()}
function setS(k){statFilter=k;renderStats()}

function renderGames(){
  const gs=S.games.filter(g=>filter==="all"||g.type===filter);
  const up=gs.filter(g=>!played(g)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const pl=gs.filter(played).sort((a,b)=>b.date.localeCompare(a.date));
  $("#s-games").innerHTML=chips(filter,"setF")+
   `<h2>משחקים קרובים</h2>`+(up.length?up.map(gameCard).join(""):`<div class="empty">אין כרגע משחק מתוכנן.</div>`)+
   `<h2>תוצאות אחרונות</h2>`+(pl.length?pl.map(gameCard).join(""):`<div class="empty">עדיין אין תוצאות.</div>`);
}
function playerStats(f){
  const m={};S.squad.forEach(p=>m[p.name]={g:0,a:0,y:0,r:0});
  S.games.filter(g=>played(g)&&(f==="all"||g.type===f)).forEach(g=>(g.events||[]).forEach(e=>{
    const x=m[e.player]=m[e.player]||{g:0,a:0,y:0,r:0};
    if(e.kind==="goal")x.g++;if(e.kind==="assist")x.a++;if(e.kind==="yellow")x.y++;if(e.kind==="red")x.r++}));
  delete m["לא ידוע"];return m;
}
function teamStats(f){
  const t={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  S.games.filter(g=>played(g)&&(f==="all"||g.type===f)).forEach(g=>{const[a,b]=g.score;t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a<b)t.l++;else{t.d++;t.pts++}});
  return t;
}
function renderSquad(){
  const ps=[...S.squad].sort((a,b)=>(a.num??999)-(b.num??999));
  const st=playerStats("all");

    return `<div class="card" style="margin:0"><span class="num">${p.num??"-"}</span><b>${esc(p.name)}</b><div class="mut">${esc(p.pos)} · ${s.g} שערים</div>${bs}</div>`}).join("")+`</div>`+((S.staff||[]).length?`<h2>צוות</h2>`+S.staff.map(s=>`<div class="card"><b>${esc(s.role)}</b>: ${esc(s.name)}</div>`).join(""):"");

function renderStats(){
  const t=teamStats(statFilter),m=playerStats(statFilter);
  const rows=Object.entries(m).filter(([n,v])=>v.g||v.a||v.y||v.r).sort((x,y)=>y[1].g-x[1].g||y[1].a-x[1].a);

   `<h2>שחקנים</h2><div class="card">`+(rows.length?`<table><tr><th>שחקן</th><th>שערים</th><th>בישולים</th><th>🟨</th><th>🟥</th></tr>`+rows.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.g}</td><td>${v.a}</td><td>${v.y}</td><td>${v.r}</td></tr>`).join("")+`</table>`:`<div class="empty">אין עדיין נתונים.</div>`)+`</div>`+
   `<div class="mut">שערים ללא שם שחקן נספרים בתוצאה אך לא בטבלת השחקנים.</div>`+
   `<h2>🏅 תגי הצטיינות</h2><div class="card">`+(S.badges.length?S.badges.map(b=>`<div>${esc(b.text)} · ${esc(b.player)}</div>`).join(""):`<div class="empty">עדיין לא הוענקו תגים.</div>`)+`</div>`;
}
function renderLeague(){
  const L=S.leagueTable,P=S.leagueScorers;

let sh={last:true,next:true,stats:true,badges:true,type:"all"};
function shareText(){
  const gs=S.games.filter(g=>sh.type==="all"||g.type===sh.type);
  const pl=gs.filter(played).sort((a,b)=>b.date.localeCompare(a.date));
  const up=gs.filter(g=>!played(g)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let o=`⚽ *${S.club} - ${S.season}*\n`;
  if(sh.last&&pl[0]){const g=pl[0];
    o+=`\n*תוצאה אחרונה* (${TYPES[g.type]})\n${g.home?"בית":"חוץ"}, ${fdl(g.date)}\nמכבי רחובות ${g.score[0]} : ${g.score[1]} ${g.opponent}\n`;
    const goals=(g.events||[]).filter(e=>e.kind==="goal"&&e.player&&e.player!=="לא ידוע").sort((a,b)=>(a.min||0)-(b.min||0));
    if(goals.length)o+=`שערים: `+goals.map(e=>e.player+(e.min?` (${e.min}')`:"")).join(", ")+`\n`;
    S.badges.filter(b=>b.gameId===g.id).forEach(b=>o+=`${b.text}: ${b.player}\n`);
    (g.events||[]).filter(e=>e.kind==="note").forEach(e=>o+=`📝 ${e.min?e.min+"' ":""}${e.text}\n`);
  }
  if(sh.stats){const t=teamStats(sh.type);const m=Object.entries(playerStats(sh.type)).filter(([n,v])=>v.g).sort((a,b)=>b[1].g-a[1].g).slice(0,5);
    o+=`\n*סטטיסטיקה*\n${t.p} משחקים: ${t.w} ניצחונות, ${t.d} תיקו, ${t.l} הפסדים. שערים ${t.gf}:${t.ga}\n`;
    if(m.length)o+=`מלכי שערים: `+m.map(([n,v])=>`${n} ${v.g}`).join(", ")+`\n`;}
  if(sh.badges&&S.badges.length)o+=`\n*תגי הצטיינות*\n`+S.badges.map(b=>`${b.text} ${b.player}`).join("\n")+`\n`;
  if(sh.next){o+=`\n*המשחקים הקרובים*\n`+(up.length?up.slice(0,3).map(g=>`${fdl(g.date)} ${g.time||""} - ${TYPES[g.type]}, ${g.home?"בית":"חוץ"} נגד ${g.opponent}${g.venue?" ("+g.venue+")":""}`).join("\n"):"אין משחק מתוכנן כרגע")+`\n`;}
  return o.trim();
}

  const txt=shareText();
  $("#s-share").innerHTML=`<div class="note">טקסט מוכן להדבקה בקבוצת הוואטסאפ של ההורים. בוחרים מה לכלול, ולוחצים שיתוף.</div>`+
   `<div class="card">${cb("last","תוצאה אחרונה")}${cb("stats","סטטיסטיקות")}${cb("badges","תגי הצטיינות")}${cb("next","משחקים קרובים")}
   <label>סוג משחקים</label><select onchange="sh.type=this.value;renderShare()">${[["all","הכול"],["league","ליגה"],["cup","גביע"],["friendly","אימון"]].map(([k,l])=>`<option value="${k}" ${sh.type===k?"selected":""}>${l}</option>`).join("")}</select></div>`+
   `<pre id="sharetxt">${esc(txt)}</pre><div class="bar"><a class="btn wa" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(txt)}">שיתוף בוואטסאפ</a><button class="btn" onclick="copyShare()">העתקה</button></div>`;
}

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
let edit=null,pendingMatch=null;
const ADMIN_SESSION=ADM+"_session",ADMIN_DAYS=30;
function isAdmin(){try{const a=JSON.parse(localStorage.getItem(ADMIN_SESSION)||"null");if(a&&a.hash===DATA.adminHash&&a.expires>Date.now())return true;if(a)localStorage.removeItem(ADMIN_SESSION);}catch{localStorage.removeItem(ADMIN_SESSION);}return sessionStorage.getItem(ADM)==="1";}
async function login(){const v=$("#pw").value.trim();if(await sha(v)===DATA.adminHash){if($("#remember-admin").checked){sessionStorage.removeItem(ADM);}else{sessionStorage.setItem(ADM,"1");}if($("#remember-admin").checked)localStorage.setItem(ADMIN_SESSION,JSON.stringify({hash:DATA.adminHash,expires:Date.now()+ADMIN_DAYS*86400000}));else localStorage.removeItem(ADMIN_SESSION);if(pendingMatch!=null){const id=pendingMatch;pendingMatch=null;editGame(id);}renderAll();if(edit)$("#s-admin").scrollIntoView({block:"start"});}else toast("קוד שגוי");}
function logout(){sessionStorage.removeItem(ADM);localStorage.removeItem(ADMIN_SESSION);pendingMatch=null;edit=null;renderAll();}
function openMatch(id){pendingMatch=id;tab("admin");if(isAdmin()){pendingMatch=null;editGame(id);}else renderAdmin();$("#s-admin").scrollIntoView({block:"start",behavior:"smooth"});}
function matchResultText(g){let t=`⚽ *${S.club} - עדכון תוצאה*\n${TYPES[g.type]} · ${fdl(g.date)} · ${g.home?"בית":"חוץ"}\n`;t+=played(g)?`${S.club} ${g.score[0]} : ${g.score[1]} ${g.opponent}\n`:`נגד ${g.opponent} - טרם עודכנה תוצאה\n`;const evs=[...(g.events||[])].sort((a,b)=>(a.min||0)-(b.min||0));for(const e of evs)t+=`${KINDS[e.kind]||"אירוע"}${e.min?" · דקה "+e.min:""}${e.player?" · "+e.player:""}${e.text?" · "+e.text:""}\n`;S.badges.filter(b=>b.gameId===g.id).forEach(b=>t+=`${b.text}: ${b.player}\n`);if(g.note)t+=`📝 ${g.note}\n`;return t.trim();}
function showMatchResult(g){$("#match-share")?.remove();const dialog=document.createElement("dialog");dialog.id="match-share";dialog.innerHTML=`<h2>עדכון תוצאה לקבוצת הוואטסאפ</h2><p class="mut">טקסט למשחק שבחרת. לא נשלח אוטומטית. השמירה מקומית; לפרסום באתר השתמשו בכפתור הפרסום.</p><textarea id="match-share-text" readonly rows="12" dir="rtl"></textarea><div class="bar"><button id="match-copy" class="btn pri">העתקת עדכון</button><button id="match-share-device" class="btn">שיתוף דרך המכשיר</button><button id="match-share-close" class="btn">סגירה</button></div>`;document.body.append(dialog);$("#match-share-text").value=matchResultText(g);$("#match-copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#match-share-text").value);toast("העדכון הועתק להדבקה בוואטסאפ");}catch{$("#match-share-text").select();toast("סמנו והעתיקו את הטקסט");}};$("#match-share-device").onclick=async()=>{if(!navigator.share){$("#match-share-text").select();return toast("העתיקו והדביקו בוואטסאפ");}try{await navigator.share({text:$("#match-share-text").value});}catch{}};$("#match-share-close").onclick=()=>{dialog.close();dialog.remove();};dialog.showModal();}

const nextId=()=>Math.max(0,...S.games.map(g=>g.id))+1;
function newGame(){edit={g:{id:nextId(),uid:"game-"+crypto.randomUUID(),type:"friendly",date:new Date().toISOString().slice(0,10),time:"18:00",opponent:"",home:true,venue:"",score:null,events:[],note:""}};renderAdmin()}
function editGame(id){if(!isAdmin())return;edit={g:JSON.parse(JSON.stringify(S.games.find(g=>g.id===id)))};renderAdmin()}
function delGame(id){if(confirm("למחוק את המשחק?")){S.games=S.games.filter(g=>g.id!==id);S.badges=S.badges.filter(b=>b.gameId!==id);persist()}}
function fld(k,v){edit.g[k]=v}
function setScore(){const a=$("#sa").value,b=$("#sb").value;if([a,b].some(x=>x!==""&&(!Number.isInteger(+x)||+x<0||+x>99))){toast("תוצאה צריכה להיות מספר שלם בין 0 ל-99");return false;}edit.g.score=(a===""||b==="")?null:[+a,+b];return true;}
function captureGame(){if(!setScore())return false;for(const [key,id] of [["opponent","eo"],["date","ed"],["time","etm"],["venue","ev"],["note","en"],["type","et2"]])edit.g[key]=$("#"+id).value;edit.g.home=$("#eh").value==="1";edit.mvp=$("#emvp").value;return true;}
function addEv(){const e={min:+$("#em").value||null,kind:$("#ek").value,player:$("#ep").value,text:$("#et").value};if(e.kind!=="note"&&!e.player){toast("בחרו שחקן");return}
  if(!captureGame())return;if(e.min!=null&&(!Number.isInteger(e.min)||e.min<0||e.min>120)){toast("דקה צריכה להיות בין 0 ל-120");return;}if(e.kind==="note"&&!e.text.trim()){toast("כתבו את האירוע המיוחד");return;}edit.g.events.push(e);renderAdmin()}
function delEv(i){if(!captureGame())return;edit.g.events.splice(i,1);renderAdmin()}
function saveGame(withUpdate=false){if(!isAdmin()||!captureGame())return;const g=edit.g;g.opponent=$("#eo").value.trim();if(!g.opponent){toast("חסר שם יריב");return}
  g.date=$("#ed").value;g.time=$("#etm").value;g.venue=$("#ev").value;g.note=$("#en").value;g.type=$("#et2").value;g.home=$("#eh").value==="1";
  const i=S.games.findIndex(x=>x.id===g.id);if(i<0)S.games.push(g);else S.games[i]=g;
  S.badges=S.badges.filter(b=>!(b.gameId===g.id&&b._m));const mv=$("#emvp").value;
  if(mv)S.badges.push({player:mv,text:"🏆 שחקן המשחק",gameId:g.id,_m:1});
  edit=null;persist();if(withUpdate)showMatchResult(g);}
function addPlayer(){const n=prompt("שם השחקן");if(!n)return;const num=prompt("מספר חולצה (אפשר להשאיר ריק)");const pos=prompt("תפקיד ("+POS.join(", ")+")","קשר");S.squad.push({num:num?+num:null,name:n,pos:pos||""});persist()}
function editPlayer(i){const p=S.squad[i];const n=prompt("שם",p.name);if(n===null)return;const num=prompt("מספר חולצה",p.num??"");const pos=prompt("תפקיד",p.pos);
  if(n!==p.name){S.games.forEach(g=>g.events.forEach(e=>{if(e.player===p.name)e.player=n}));S.badges.forEach(b=>{if(b.player===p.name)b.player=n})}
  S.squad[i]={num:num===""?null:+num,name:n,pos:pos||""};persist()}

function addBadge(){const p=$("#bp").value,t=$("#bt").value.trim();if(!p||!t)return;S.badges.push({player:p,text:t,gameId:null});persist()}

function resetLocal(){if(confirm("לבטל שינויים שלא פורסמו ולחזור לנתוני האתר?")){localStorage.removeItem(LS);S=JSON.parse(JSON.stringify(DATA));dirty=false;renderAll()}}
function saveSettings(){const u=$("#lu").value.trim();S.leagueUrl=u;S.leagueUpdated=$("#lupd").value.trim();persist()}
function b64(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)))}
function unb64(s){const b=atob(s.replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
function setToken(){const t=prompt("הדביקו GitHub token (Fine-grained, הרשאת Contents: Read and write על ה-repo בלבד)");if(t){localStorage.setItem(TOK,t.trim());renderAdmin()}}
async function publish(){
  const tok=localStorage.getItem(TOK);if(!tok){toast("חסר token");return}
  const api=`https://api.github.com/repos/${REPO}/contents/index.html`,h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  try{
    toast("מפרסם...");
    const r=await fetch(api,{headers:h});if(!r.ok)throw new Error("קריאה נכשלה "+r.status);
    const f=await r.json(),src=unb64(f.content);
    const clean=JSON.parse(JSON.stringify(S));clean.rev=Date.now();clean.badges.forEach(b=>delete b._m);
    const a=src.indexOf("/*DATA_START*/"),z=src.indexOf("/*DATA_END*/");if(a<0||z<0)throw new Error("סימוני נתונים חסרים");
    const out=src.slice(0,a)+"/*DATA_START*/\nconst DATA = "+JSON.stringify(clean,null,1)+";\n"+src.slice(z);
    const p=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"עדכון נתונים מהאתר",content:b64(out),sha:f.sha})});
    if(!p.ok)throw new Error("שמירה נכשלה "+p.status);
    localStorage.removeItem(LS);dirty=false;toast("פורסם. יופיע לכולם בעוד כדקה");
  }catch(e){toast("שגיאה: "+e.message)}
}
function exportData(){const clean=JSON.parse(JSON.stringify(S));navigator.clipboard.writeText(JSON.stringify(clean,null,1)).then(()=>toast("הנתונים הועתקו"),()=>toast("ההעתקה נכשלה"))}

 E('#v-close').onclick=()=>{E('#v-player')?.pause();area.innerHTML='';current=null;};(E('#v-player')||E('#v-photo')).onerror=()=>{E('#v-player-error').textContent='לא ניתן לנגן את הקליפ. ייתכן שהקישור פג, שהמכסה מוצתה או שפורמט הקליפ אינו תואם. פתחו שוב; אם זה חוזר, פנו למנהל.';};
 E('#v-full').onclick=async()=>{const player=E('#v-player')||E('#v-photo');try{if(player.webkitEnterFullscreen)player.webkitEnterFullscreen();else await player.requestFullscreen();}catch{notice('אפשר להשתמש בכפתור המסך המלא של הנגן.');}};
 const inGame=filtered().filter(x=>x.gameId===v.gameId&&['approved','pending'].includes(x.status)),i=inGame.findIndex(x=>x.id===id);E('#v-prev').disabled=i<=0;E('#v-next').disabled=i>=inGame.length-1;E('#v-prev').onclick=()=>play(inGame[i-1].id);E('#v-next').onclick=()=>play(inGame[i+1].id);
 E('#v-adminremove')&&(E('#v-adminremove').onclick=()=>remove(id));
 E('#v-report').onclick=async()=>{const reason=prompt('מה תרצו להסיר או לבדוק? אין לציין מידע אישי שאינו נחוץ.');if(!reason)return;try{await api('/videos/'+id+'/report','POST',{reason});notice('בקשת ההסרה נשלחה למנהל.');}catch(e){notice(errorText(e));}};
 E('#v-approve')&&(E('#v-approve').onclick=async()=>{try{await api('/videos/'+id+'/moderate','POST',{action:'approve',title:E('#v-title-edit').value,reviewedClip:E('#v-reviewed').checked});current=null;await load();notice('הקליפ אושר למשפחות.');}catch(e){notice(errorText(e));}});
 E('#v-reject')&&(E('#v-reject').onclick=async()=>{if(!confirm('לדחות ולמחוק את הקליפ מהאחסון?'))return;try{await api('/videos/'+id+'/moderate','POST',{action:'reject'});current=null;await load();}catch(e){notice(errorText(e));}});
 }catch(e){area.innerHTML=`<div class="note" role="status">${h(errorText(e))}</div>`;}
}
async function remove(id){if(!confirm('למחוק את ההעלאה מהאחסון?'))return;try{await api('/videos/'+id,'DELETE');await load();}catch(e){notice(errorText(e));}}
function renderUpload(){sec().innerHTML=base()+`<div class="card"><div class="bar">${button('v-back','חזרה לסרטונים')}</div><h2>מעלים תמונה או רגע מהמשחק</h2><p class="mut">הייליטס בלבד: עד 90 שניות ועד 100MB. קובץ MP4 שניתן לנגן במכשיר. תמונות JPEG, PNG או WebP עד 20MB: מוקטנות ל-1600 פיקסלים ונשמרות כ-JPEG עד 5MB ללא מטא-נתוני EXIF. תמונות HEIC יש להמיר לפני הבחירה. אין המרת סרטונים אוטומטית.</p><form id="v-form"><label for="v-uploadgame">משחק</label><select id="v-uploadgame" required><option value="">בחירת משחק</option>${games.map(g=>`<option value="${h(g.id)}" ${g.id===filter.game?'selected':''}>${h(g.date)} · ${h(g.opponent)}</option>`).join('')}</select><label for="v-file">בחירת תמונה או קליפ מהטלפון</label><input id="v-file" type="file" accept="video/mp4,.mp4,image/jpeg,image/png,image/webp" required><label for="v-title">כותרת קצרה</label><input id="v-title" required maxlength="80" placeholder="למשל: ההצלה בדקה 24"><label for="v-minute">דקה במשחק (לא חובה)</label><input id="v-minute" type="number" min="0" max="120" inputmode="numeric"><fieldset class="v-fieldset"><legend>תיוג האירוע</legend>${tags.map(t=>`<label class="v-check"><input name="v-tag" type="checkbox" value="${h(t)}">${h(t)}</label>`).join('')}</fieldset><label class="v-check"><input id="v-permission" type="checkbox" required>יש לי רשות לשתף את הפריט עם המשפחות, כולל הסכמות הנדרשות מהורי המצולמים</label><div class="bar">${button('v-submit','העלאה לאישור','pri')}${button('v-cancel','ביטול העלאה')}</div><progress id="v-progress" max="100" value="0" hidden></progress><div id="v-uploadstatus" role="status"></div></form></div>`;bindLogout();E('#v-back').onclick=()=>{if(xhr)return notice('בטלו או סיימו את ההעלאה לפני החזרה.');view='gallery';render();};E('#v-cancel').onclick=()=>{xhr?.abort();};E('#v-submit').onclick=submitUpload;E('#v-form').onsubmit=e=>{e.preventDefault();submitUpload();};}
async function probe(file){return new Promise((resolve,reject)=>{const v=document.createElement('video'),url=URL.createObjectURL(file);v.preload='metadata';v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(url);resolve(d);};v.onerror=()=>{URL.revokeObjectURL(url);reject(Error('mp4_required'));};v.src=url;});}
async function preparePhoto(file){const bitmap=await createImageBitmap(file);if(bitmap.width*bitmap.height>50000000){bitmap.close();throw Error('file_too_large');}const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.85));if(!blob||blob.size>5000000)throw Error('file_too_large');return new File([blob],'photo.jpg',{type:'image/jpeg'});}
async function submitUpload(){
 if(xhr)return;if(!E('#v-form').reportValidity())return;let file=E('#v-file').files[0];const chosen=[...sec().querySelectorAll('input[name="v-tag"]:checked')].map(x=>x.value);if(!chosen.length)return notice('בחרו לפחות תיוג אחד.');
 let id;E('#v-submit').disabled=true;
 try{const photo=['image/jpeg','image/png','image/webp'].includes(file.type);if(file.size>(photo?20000000:100000000))throw Error('file_too_large');let d=0;if(photo){file=await preparePhoto(file);}else{if(!/\.mp4$/i.test(file.name))throw Error('photo_required');d=await probe(file);if(!Number.isFinite(d)||d>90||d<=0)throw Error('clip_too_long');}
  const r=await api('/uploads','POST',{gameId:E('#v-uploadgame').value,title:E('#v-title').value,tags:chosen,minute:E('#v-minute').value===''?null:Number(E('#v-minute').value),bytes:file.size,duration:d,kind:photo?'photo':'video',contentType:photo?'image/jpeg':'video/mp4',permissionConfirmed:E('#v-permission').checked});id=r.id;
  E('#v-progress').hidden=false;E('#v-uploadstatus').textContent='מעלים... השאירו את המסך פתוח. אין לעלות שוב אם החיבור נקטע.';
  await new Promise((resolve,reject)=>{xhr=new XMLHttpRequest();xhr.open('PUT',C.apiBase.replace(/\/$/,'')+'/videos/'+id+'/upload');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.setRequestHeader('Content-Type',file.type||'video/mp4');xhr.upload.onprogress=e=>{if(e.lengthComputable)E('#v-progress').value=Math.round(e.loaded/e.total*100);};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve();else{let msg='upload_uncertain';try{msg=JSON.parse(xhr.responseText).error||msg;}catch{}reject(Error(msg));}};xhr.onerror=()=>reject(Error('upload_uncertain'));xhr.onabort=()=>reject(Error('upload_uncertain'));xhr.send(file);});
  xhr=null;view='gallery';filter.view='mine';await load();notice('הפריט נשלח לאישור. רק אתם והמנהל יכולים לצפות בו עד האישור.');
 }catch(e){xhr=null;notice(errorText(e));E('#v-submit')&&(E('#v-submit').disabled=false);if(id){E('#v-uploadstatus').textContent='מספר בדיקה: '+id+'. פנו למנהל לפני העלאה חוזרת.';E('#v-submit').disabled=true;}}
}
async function renderFamilies(){sec().innerHTML=base()+`<div class="card"><div class="bar">${button('v-back','חזרה לסרטונים')}</div><h2>בקשות הצטרפות</h2><p class="mut">הורים פותחים את קישור ההרשמה, מתחברים עם Google ושולחים בקשה. אין אישור אוטומטי.</p><input id="v-signuplink" readonly dir="ltr" value="${h(location.origin+location.pathname+'?signup=1#videos')}"><div id="v-requests"></div><h2>משפחות מאושרות</h2><p class="mut">כתובות נשמרות רק בשירות הפרטי, לא באתר הציבורי. הוספה מאפשרת כניסה; היא אינה שולחת הזמנה.</p><label for="v-email">חשבון Google של ההורה</label><input id="v-email" type="email" dir="ltr" placeholder="parent@example.com"><div class="bar">${button('v-addfamily','הוספת משפחה','pri')}</div><div id="v-familylist"></div><h2>בקשות הסרה</h2><div id="v-reports"></div></div>`;bindLogout();E('#v-back').onclick=()=>{view='gallery';render();};E('#v-addfamily').onclick=async()=>{try{await api('/admin/members','POST',{email:E('#v-email').value});renderFamilies();}catch(e){notice(errorText(e));}};try{const [d,r,q]=await Promise.all([api('/admin/members'),api('/admin/reports'),api('/admin/requests')]);if(view!=='families')return;E('#v-requests').innerHTML=q.requests.length?q.requests.map(q=>`<div class="card"><b dir="ltr">${h(q.email)}</b><div class="bar"><button class="btn pri" data-requestemail="${h(q.email)}" data-action="approve">אישור גישה</button><button class="btn red" data-requestemail="${h(q.email)}" data-action="reject">דחייה</button></div></div>`).join(''):'<p class="mut">אין בקשות ממתינות.</p>';sec().querySelectorAll('[data-requestemail]').forEach(b=>b.onclick=async()=>{try{await api('/admin/requests','POST',{email:b.dataset.requestemail,action:b.dataset.action});renderFamilies();}catch(e){notice(errorText(e));}});E('#v-familylist').innerHTML=d.members.map(m=>`<div class="card"><b dir="ltr">${h(m.email)}</b><div class="mut">${m.role==='admin'?'מנהל':m.enabled?'משפחה מאושרת':'גישה בוטלה'}</div>${m.role!=='admin'&&m.enabled?`<button class="btn sm red" data-revoke="${h(m.email)}">ביטול גישה</button>`:''}</div>`).join('');sec().querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('לבטל גישה לחשבון '+b.dataset.revoke+'?'))return;try{await api('/admin/members','POST',{email:b.dataset.revoke,enabled:false});renderFamilies();}catch(e){notice(errorText(e));}});E('#v-reports').innerHTML=r.reports.length?r.reports.map(r=>`<div class="card"><div>${h(r.reason)}</div><div class="mut">${h(r.created_at)}</div><button class="btn sm" data-reportvideo="${h(r.video_id)}">פתיחת הקליפ</button></div>`).join(''):'<div class="mut">אין בקשות הסרה.</div>';sec().querySelectorAll('[data-reportvideo]').forEach(b=>b.onclick=()=>{view='gallery';render();play(b.dataset.reportvideo);});}catch(e){notice(errorText(e));}}
window.TeamVideos={open(gameId){filter.game=gameId||'';view='gallery';tab('videos');render();},render};
document.addEventListener('visibilitychange',()=>{if(document.hidden)E('#v-player')?.pause();});
render();
})();
